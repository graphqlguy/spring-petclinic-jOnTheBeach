# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# GraphQL
spring.graphql.graphiql.enabled=true
# Subscriptions run over a WebSocket at the same path as the HTTP endpoint
spring.graphql.websocket.path=/graphql
# true runs the files in operations/ and operations-ui/ alone, and refuses every other document
petclinic.trusted-documents-only=false

# Security
# The key pair that signs and checks access tokens. For development only.
petclinic.jwt.public-key=classpath:keys/petclinic-dev.pub
petclinic.jwt.private-key=classpath:keys/petclinic-dev.key

# MCP
# GATool serves the three dynamic tools below alone at /mcp: this folder does not exist, so GATool
# skips the operation files. Chapter 11's trusted documents still read them from operations/.
gatool.mcp.operations.locations=optional:classpath*:none/
# An answer with data and errors is a success: the errors say which fields stay null, and why
gatool.results.partial-results-as-success=true
# The name MCP clients show for this server
spring.ai.mcp.server.name=petclinic
# What the model of an MCP client reads when it connects. This text replaces GATool's, so it names
# the topics of the API and then says how to use the three tools. Spring Boot reads this file as
# ISO-8859-1, so the value writes the á of Málaga as \u00e1.
spring.ai.mcp.server.instructions=This server answers questions about a veterinary clinic in M\u00e1laga, Spain, and about \
  public data on pets, animals and daily life in Spain, Andalusia and M\u00e1laga. \
  The API holds the clinic's owners with their addresses, their pets and visits, and its vets, and for an owner who \
  lives in M\u00e1laga, the dog parks and drinking fountains nearest to their home, with the distance to each. \
  It also reads public services: the dog parks, drinking fountains and city buses of M\u00e1laga; veterinary medicines \
  (CIMAVet) and medicines for people (CIMA); mosquito reports (Mosquito Alert); the land registry (Catastro); datasets \
  of the Junta de Andaluc\u00eda, such as museums and holidays; regional buses (CTAN); fuel prices; statistics (INE); \
  laws and the official gazette (BOE); the open data catalogues of Spain and M\u00e1laga; electricity demand and prices \
  (Red El\u00e9ctrica); addresses, places and maps (IDEE, IGN); and the OpenStreetMap geocoder, which turns an address \
  into latitude and longitude. \
  For a question on any of these topics, search the schema before you decide the API cannot answer it. \
  Find the fields with searchSchema, use introspectType if you need more details about a type, and run the query \
  with executeGraphql. Some fields, such as an owner's telephone, need a signed-in staff member.
# The MCP endpoint is an OAuth 2.1 resource server: every call carries an access token that
# the authorization server below issued for the endpoint
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:${server.port:8080}
gatool.mcp.security.resource=http://localhost:${server.port:8080}/mcp
# Every MCP call needs this scope
gatool.mcp.security.baseline-scopes=mcp:tools

# Dynamic tools
# Three tools, with which the model writes its own GraphQL: searchSchema, introspectType
# and executeGraphql. MCP clients and the assistant both get them.
gatool.dev.experimental.generate-tools=dynamic-three-step
# searchSchema ranks the schema's fields by meaning, with the embedding model pulled in the setup
gatool.dev.experimental.dynamic-operations.search-backend=embedding
spring.ai.ollama.embedding.model=qwen3-graphql-embedder

# Authorization server
# This application signs MCP clients in, and issues their tokens
spring.security.oauth2.authorizationserver.issuer=http://localhost:${server.port:8080}

# Chat
# The assistant in the frontend gets the same three tools, inside the application
gatool.in-process.operations.locations=optional:classpath*:none/
# The chat model in Ollama, pulled in the setup with: ollama pull granite4.1:8b
spring.ai.ollama.chat.model=granite4.1:8b
# The model reads the tools, the question and the tool results within this many tokens.
# Ollama picks a size from your memory when this is unset, so set it for the same result on every laptop.
spring.ai.ollama.chat.num-ctx=8192
# One call to the model, so the chat reports at once when Ollama is not running. By default
# Spring AI tries a failed call 10 more times, with pauses that grow to 3 minutes.
spring.ai.retry.max-attempts=0
# The calls to the model go through the JDK's HTTP client. Reactor Netty, which Spring AI also
# brings, logs an ERROR about DNS on macOS at its first call.
spring.http.clients.imperative.factory=jdk
# Logs the name of each tool the model calls
logging.level.org.springframework.ai.model.tool=DEBUG

# Spanish public services
# The schema also reads public services of Spain, Andalusia and Malaga. These are the live URLs;
# the "mock" profile points them at answers recorded from the services, see application-mock.properties.
petclinic.upstream.connect-timeout=10s
petclinic.upstream.read-timeout=20s
# Several services ask callers to name their application
petclinic.upstream.user-agent=spring-petclinic-jonthebeach (https://github.com/graphqlguy/spring-petclinic-jOnTheBeach)
# Spring Web Services is here for its SOAP client. Petclinic does not serve any SOAP endpoints,
# so the server side, a MessageDispatcherServlet at /services, stays off.
spring.autoconfigure.exclude=org.springframework.boot.webservices.autoconfigure.WebServicesAutoConfiguration
# Each service has a block of its own below, headed with its name

# The open data of the city of Málaga: parks for dogs, drinking fountains and the EMT buses
spring.http.serviceclient.malaga.base-url=https://datosabiertos.malaga.eu
spring.http.serviceclient.malaga.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.malaga.read-timeout=${petclinic.upstream.read-timeout}

# Nominatim, the geocoder of OpenStreetMap, which finds owners' addresses on the map
spring.http.serviceclient.nominatim.base-url=https://nominatim.openstreetmap.org
spring.http.serviceclient.nominatim.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.nominatim.read-timeout=${petclinic.upstream.read-timeout}

# The Catastro, the land registry of Spain, over SOAP: its street directory and its service of
# coordinates. Its firewall turns away requests without a User-Agent that names the application.
petclinic.upstream.catastro.callejero-url=https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCallejero.asmx
petclinic.upstream.catastro.coordenadas-url=https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCoordenadas.asmx

# CIMAVet, the register of veterinary medicines of the AEMPS
petclinic.upstream.cimavet.url=https://cimavet.aemps.es/cimavet/rest

# CIMA, the register of medicines for people of the AEMPS, which vets read for the cascade
petclinic.upstream.cima.url=https://cima.aemps.es/cima/rest

# Mosquito Alert, the citizen science project that maps mosquitoes, from its OpenAPI document.
# Its reads work without an account.
petclinic.upstream.mosquitoalert.url=https://api.mosquitoalert.com/v1

# The Network of Transport Consortia of Andalusia (CTAN): lines, stops, timetables and fares
petclinic.upstream.ctan.url=https://api.ctan.es/v1/Consorcios

# The open data API of the Junta de Andalucía: holidays, tourism register, regulations and more
petclinic.upstream.junta.url=https://datos.juntadeandalucia.es/api/v0

# The fuel prices of the Ministry for the Ecological Transition, from its help page. The same service
# at sedeaplicaciones.minetur.gob.es offers only TLS_RSA cipher suites, which current JDKs turn off.
petclinic.upstream.fuel.url=https://energia.serviciosmin.gob.es/ServiciosRESTCarburantes/PreciosCarburantes

# The Spanish National Statistics Institute (INE): statistical operations, tables and series, in English
petclinic.upstream.ine.url=https://servicios.ine.es/wstempus/js/EN

# The open data API of the Boletín Oficial del Estado (BOE): consolidated laws and the daily summaries
petclinic.upstream.boe.url=https://www.boe.es/datosabiertos/api

# datos.gob.es, the national catalogue of open data of Spain
petclinic.upstream.datosgob.url=https://datos.gob.es/apidata

# The catalogue of the open data portal of the city of Málaga, its CKAN Action API
petclinic.upstream.malagacatalog.url=https://datosabiertos.malaga.eu/api/3/action

# REData, the open data of Red Eléctrica, the operator of the Spanish electricity grid, in English. Red Eléctrica blocks an address that sends many requests in a row.
petclinic.upstream.ree.url=https://apidatos.ree.es/en/datos

# The OGC API Features service of the National Cartographic System of Spain, run by the IGN: addresses, land use, hydrography and transport networks
petclinic.upstream.idee.url=https://api-features.idee.es
# A search of land cover took 30 seconds on 23 October 2026, so this service waits longer
petclinic.upstream.idee.read-timeout=60s

# The OGC API Features service of the National Geographic Institute (IGN): administrative units, geographic names, population centres and geodetic networks
petclinic.upstream.ign.url=https://api-features.ign.es

# JPA
spring.jpa.hibernate.ddl-auto=none
# GraphQL reads lazy relationships, such as the pets of an owner, while it builds the
# response, so the persistence context stays open until the request ends
spring.jpa.open-in-view=true
# Logs every SQL statement. Chapter 2 turns it on to count the statements of a query.
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Workshop
# Pauses every service call for this long, so that each database round trip shows in the
# response time. Chapter 2 sets it to 1s.
petclinic.demo.latency=0s

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
