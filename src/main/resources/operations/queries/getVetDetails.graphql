# Returns one vet with their specialties and every visit they have seen or will see, newest first, with the pet and its owner.
# The listVets and search tools give the id of a vet. An unknown id returns a NOT_FOUND error.
query GetVetDetails($id: ID!) {
  vet(id: $id) {
    id
    firstName
    lastName
    specialties {
      id
      name
    }
    visits {
      id
      date
      description
      pet {
        id
        name
        type {
          name
        }
        owner {
          id
          firstName
          lastName
        }
      }
    }
  }
}
