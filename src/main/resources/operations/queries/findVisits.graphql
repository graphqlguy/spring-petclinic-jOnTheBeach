# Lists the visits from one date to another, both included, in date order, with the pet, its owner and the vet.
# Dates are written as 2026-10-21. Use it for questions such as which visits are booked for next week.
query FindVisits($from: Date!, $to: Date!) {
  visits(from: $from, to: $to) {
    id
    date
    description
    pet {
      id
      name
      type {
        name
      }
      owner {
        id
        firstName
        lastName
      }
    }
    vet {
      id
      firstName
      lastName
    }
  }
}
