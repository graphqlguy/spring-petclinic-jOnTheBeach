# ./mvnw spring-boot:run -Popenai, with your key in the OPENAI_API_KEY environment variable
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-mini
# The embedding model runs in Ollama, so searchSchema ranks the schema's fields by their words
gatool.dev.experimental.dynamic-operations.search-backend=bm25
