# ./mvnw spring-boot:run -Panthropic, with your key in the ANTHROPIC_API_KEY environment variable
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-haiku-5-5
# The embedding model runs in Ollama, so searchSchema ranks the schema's fields by their words
gatool.dev.experimental.dynamic-operations.search-backend=bm25
